expect  = "000000000000000000000000000000000000000000000000"
replace = "0000005e0000005f00000060000000620000003f00000000"
gate    = "!chr"



# ------------------------------------------------------------ 0007, part 2
# cave2 is full: the settings' storage helpers (slot_rd / slot_wr, section .ui2)
# sit in `cave` after 0008. On the MKII `cave` is 224 B smaller than the MK1's, so
# the label lookup name_of and its names moved to cave7 as section .ui5.
# MK1: one .ui2 claim at 0x40234d9c, size 0x1b4
[[cave]]
owner   = "0007-digital-path"
section = ".ui2"
addr    = 0x40252e90
size    = 0xc0
note    = "slot_rd / slot_wr (a kit byte, or a sound's WAV word), snd_word and the NOISE page's SHP / FLD / FM strings."

# MKII only.
[[cave]]
owner   = "0007-digital-path"
section = ".ui5"
addr    = 0x400d3a52
size    = 0x10c
note    = "name_of (the knob labels on the DIST and NOISE pages, SHP / FLD / FM with WAV on) and the mode / chord names, in dead code (cave7)."

# ------------------------------------------------------------ 0010 wave oscillator
# Not in the default image (`make full`). In `cave` after 0007's part 2, which on
# the MKII fills `cave` to its end, and in cave3 (the chorus gap).
# MK1: 0x40234f50
[[cave]]
owner = "0010-wave-osc"
addr  = 0x40252f50
size  = 0xb0
note  = "The noise-mix, fade-envelope and sound-converter gates. The oscillator is in cave3 (the chorus gap); its state is in free DDR (MKII 0x47be1000; MK1 0x46803000)."

# MK1: 0x401eeb08
[[cave]]
owner   = "0010-wave-osc"
section = ".gap"
addr    = 0x40215258
size    = 0x400
note    = "The oscillator: two-wave blend, chords, fold, FM (sine at OSC2's pitch); the chorus index clamp."

# The chorus's index load: mvsb 0x80005c3e,%d0 (MK1 0x8000517e), re-emitted with a
# clamp to >= 0. On the MKII the index scales into the table at 0x40215658, right
# above the gap.
# MK1: 0x400f8400
[[detour]]
owner  = "0010-wave-osc"
addr   = 0x400fe20c
size   = 6
expect = "713980005c3e"   # MK1: 71398000517e
entry  = "cho_gate"

# The noise generator, between the fade envelope update and the levels taken from
# the envelopes: lea 0x80002be8,%a0 (MK1 0x80001be8), re-emitted. WAV voices get a full envelope (no
# fade), so FAD is free to be their FM depth.
# MK1: 0x400fa094
[[detour]]
owner  = "0010-wave-osc"
addr   = 0x400ffe04
size   = 6
expect = "41f980002be8"   # MK1: 41f980001be8
entry  = "fad_gate"

# The noise generator's final mix: lea 0x80005ba8,%a1 (MK1 0x800050e8), re-emitted.
# MK1: 0x400fa0e0
[[detour]]
owner  = "0010-wave-osc"
addr   = 0x400ffe50
size   = 6
expect = "43f980005ba8"   # MK1: 43f9800050e8
entry  = "wave_gate"

# The sound converter (350-byte record -> the live 338-byte format) skips parameter
# word 103, where WAV lives: lea %sp@(-28),%sp; moveml %d2-%d3/%a2-%fp,%sp@,
# re-emitted.
# MK1: 0x40008530
[[detour]]
owner  = "0010-wave-osc"
addr   = 0x40008808
size   = 6
expect = "4fefffe448d77c0c"
entry  = "conv_gate"

# The NOISE page's empty knobs (page 7's ids [74, 75, 76, 0, 77, 0..]): the 4th = 92
# (AMP REL, a dial), the mode OFF/WAV/CHD; the 6th = 94 (AMP CHO, a dial), the
# chord type. 0007's layer table maps both to fields of the sound's word 103.
# MK1: 0x401950e8
[[patch]]
owner   = "0010-wave-osc"
addr    = 0x401b332c
size    = 4
expect  = "00000000"
replace = "0000005c"

# MK1: 0x401950f0
[[patch]]
owner   = "0010-wave-osc"
addr    = 0x401b3334
size    = 4
expect  = "00000000"
replace = "0000005e"

