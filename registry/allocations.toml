# PORTED from the OS 1.55 registry (2026-10-17, docs/PORT-1.56.md). Addresses and
# expect bytes are 1.56; comments may still cite the 1.55 addresses.
#
# Single source of truth for every scarce resource a mod can claim - Analog Four /
# Analog Keys MK1, OS 1.56. Same rules as rytm1_mods-main's registry: tools/layout.py
# asserts that no two claims overlap and that every claim sits inside its pool;
# tools/build.py checks every `expect` against the stock bytes before patching.
#
# owner = the mod directory name, or "reserved:<reason>".

[meta]
target = "OS1.56"
device = "Analog Four / Analog Keys MK1"

# ---------------------------------------------------------------- the image
#
# From the startup code (entry 0x40000e52, the image's first long):
#   0x40000dc6  copies 0x40235000..0x4023c4a0 to SRAM 0x80000000 and
#               0x4023c4a0..0x402437e0 (the image's end) to 0x80008000.
#   0x40000e1c  zeroes 0x40235000..0x4260fb10: __bss_start = 0x40235000.
# So everything at or above 0x40235000 is initialiser data and then .bss, and
# NOTHING below it is .bss. tools/cavescan.py reads these bounds out of the image.
#
# THE TRAP, as on the Rytm MK1: 0x40226958..0x40233a30 is the bootstrap, embedded in
# MAIN OS. At every boot 0x40000e6a compares its version word (0x40226958) with the
# one in flash (0xfff8) and, if it is newer, 0x401006dc writes 0x40226960..0x40233a30
# into the bootstrap sectors. A mod byte in that range could one day be written into
# the recovery path. No pool may touch it, and build and verify assert its hash.

# ---------------------------------------------------------------------- pools

[[pool]]
name   = "cave"
start  = 0x40234860
end    = 0x40235000          # exclusive; 1952 B
status = "probably-verified"
note   = """
The A4 twin of the Rytm MK1's cave2 (which is the twin of MKII cave2, run on
hardware with 0003 and 0004): alignment padding between the end of the read-only
data and the first SRAM load image.

Evidence, all static, on this image (tools/cavescan.py):
- 0x40234858..0x40235000 is zeros. The pool starts 8 bytes in to keep claims aligned.
- Just below is the C++ static-constructor table: count 122 at 0x4023466c, entries
  from 0x40234670, so it ends exactly at 0x40234858. Its only reader, 0x400ff76a,
  loops by that count.
- No 32-bit word at any even offset in the image points into 0x40234858..0x40235000.
- 0x40235000 is where both the SRAM copy (0x40000dc6) and the .bss clear
  (0x40000e1c) start; the gap is below both and nothing else writes it.

"probably-verified" rather than "candidate" on the same complete static case the
Rytm MK1 project used for its twin: below __bss_start, so nothing clears or reuses
it; above the last constructor, so nothing reads it as a table; nothing points into
it.

Hardware, 2026-10-09: 0001 has run from here across three flashes - boot, menus,
playing, step entry - with no fault.
"""

