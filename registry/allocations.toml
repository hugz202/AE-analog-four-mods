# key_offset (transposition): values 3..35 take the MAJ arm (12 - key) instead of 0.
# Stock: v == 1 -> MAJ, v == 2 -> MIN, else 0. Patched: 1 - v > 0 (v <= 0) -> 0,
# then 2 - v != 0 -> MAJ, so 2 alone falls through to MIN.
# MK1: 0x40077a4e
[[patch]]
owner   = "0001-scale-lock"
addr    = 0x40079f3a
size    = 2
expect  = "6714"
replace = "6e20"

