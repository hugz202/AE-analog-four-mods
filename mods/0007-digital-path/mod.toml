[mod]
id      = "0007-digital-path"
title   = "Digital path: per-track snatch + distortion (HARD / RAT / OD), edited on the DIST page"

# Not in the default build: `make full` builds it with 0001, 0002, 0006 and 0008.
# Needs 0006 (its settings persist in the kit's spare FX words) and 0008 (the DIST
# page its controls live on).
enabled = false

# re-only | built | hardware-verified | retracted
status  = "hardware-verified"

# 0004 hooks the same dry-volume load; it is a measuring probe, never in this build.
excludes = ["0004-dsp-probe"]

summary = """
Per synth track, on the DIST page (press AMP twice):

  DIG   switch: the track's analog dry sound is muted and its digitised copy is
        processed instead (the A4 already digitises each voice for the effects),
        through a fixed 12 dB/oct high-pass first (-6 dB at 75 Hz, as filter 2's
        HP2 at FRQ ~32, RES 0) so the low end doesn't swamp the drive
  CHR   3 positions: HARD (digital clipper), RAT (treble lift, darkening op-amp
        roll-off, hard clip, 4 kHz tone), OD (720 Hz mid hump, soft clip, 2.5 kHz)
  DRV   drive into the clipper: 0 = clean, +6 dB per 16 steps, the first ~9.5 dB
        taken back off after it, so more drive = more grit at about the same level
  BIT   bit reduction, 0 = off, 13 down to 2 bits, rounded (no DC, no level jump)
  SRR   sample-rate reduction (sample hold), 0 = off
  LEV   level of the processed signal on the main out, ~100 = level with the
        analog path
  SLD   the 303 slide switch (read by 0002)

The processed signal also replaces the voice in the effect sends (trimmed as DRV
rises, since a clipped signal is denser), so delay/reverb/chorus hear the
distortion. Settings are per kit, in its spare FX words (saved by 0006). No p-locks.

The same knob machinery also runs 0010's WAV switch on the NOISE page (kept in the
sound, not the kit) and relabels S&H / COL as SHP / FLD while it is on.
"""

[params]
# 1: three drive characters, HARD / RAT / OD, on the DIST page's CHR knob.
# 0: HARD only - no CHR knob (the DIST page closes up: DIG DRV BIT SRR LEV / SLD),
#    no character filters; HARD sounds exactly as with chr = 1. (The audio inputs
#    on the digital path were tried here and dropped: shelved/inputs-dist.)
chr = 1

[sources]
stub = "stub.s"

[requires]
# 0008's shared_is_p17 / shared_p17_drawing: the settings live on the DIST page.
shared = true
symbols = [
  "project_ptr",
  "track_index_of",
  "fx_change_info_vt",
  "dry_volume_resume",
  "fx_block_body",
  "fx_block_tail_resume",
  "page_get_value_body",
  "encoder_apply_resume",
  "encoder_exit",
  "param_label_body",
  "short_name_resume",
]
