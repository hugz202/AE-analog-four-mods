# Analog Four / Analog Keys MK1 symbol map, OS 1.56.
#
# PORTED from the OS 1.55 map (2026-10-17, docs/PORT-1.56.md): every addr below
# was mapped into 1.56 (re/os156/map156.py) and checked; the evidence texts
# still cite the 1.55 addresses they were found at.
#
# Addresses are virtual (load base 0x40000400); file_offset = addr - 0x40000400.
# Everything here was read in THIS image (build/mainos.dis, `make disasm`). Where an
# address was found by matching the Rytm MK1 1.73 image with tools/xmatch.py, the
# Rytm address is recorded as ar1 = ...; the two are the same Elektron code base.
#
# status = "verified"  found in this image AND its behaviour read and checked
#          "mapped"    a routine starts there and it fits, but not read in full
# evidence = how it was found / checked.

[meta]
target        = "OS1.56"
device        = "Analog Four / Analog Keys MK1"
base          = 0x40000400
mainos_size   = 2372584
mainos_sha256 = "cc19347b11d220aba73e4fd7203b2ce4e6d6d9553308d713648885682c714c26"

# As on the Rytm MK1 the container carries ONE section, MAIN OS, and the bootstrap
# rides inside it. The startup code (0x40000e6a) compares the version word at
# 0x40226958 with flash 0xfff8 and, if the embedded one is newer, 0x401006dc writes
# 0x40226960..0x40233a30 (its loop bound, cmpil at 0x401007d4) into the bootstrap
# sectors. See docs/HAZARDS.md.
embedded_bootstrap_start  = 0x40226ee8          # version words, then the image
embedded_bootstrap_end    = 0x40233fc0          # exclusive; the flasher's loop bound
embedded_bootstrap_sha256 = "24c04cc5000b893c4faf0bda2db559ce4971a1b3df91f612bcd5fb48dffb5924"

# ColdFire V4e with EMAC, no FPU, as the Rytm MK1 (same platform; the image uses
# mvz/mvs and remsl/mulsl, and no FPU instructions).
cpu = "5475"
cpu_flags = ["-mno-float"]

# ======================================================================== core
[fn.project_singleton]
addr = 0x4012e890
status = "verified"
evidence = "Lazy construction (tstl 0x415cba24, allocate 0x3de9c) and the first call of every NOTE SETUP getter/setter thunk (0x400d5f58 etc.), exactly as the Rytm's project_singleton."

[fn.current_track_pattern]
addr = 0x400a2fb8
ar1 = 0x400ac2e8
status = "verified"
evidence = "track_index_of(this + 48) = 0x400aa78c, then the active-pattern getter 0x400a2bbe, then pattern_track 0x4009ebe4 - the Rytm routine instruction for instruction. Every NOTE SETUP thunk calls it on project_singleton's result."

[fn.track_index_of]
addr = 0x400aab78
ar1 = 0x400b3a04
status = "verified"
evidence = "Called as track_index_of(sel) on this+48 by current_track_pattern, and on view+116 by param_apply_delta - the Rytm's two uses."

# ================================================================= scale library
# Linked into 1.55 but never called: no jsr/lea/data word anywhere refers to these
# routines or to the two name tables. Shared Elektron library code.
[fn.in_scale]
addr = 0x4007ed90
status = "verified"
sig = "bool(int note, int key, int scale)"
evidence = "note > 127 -> 0; scale == -1 -> 1; reduces note - key into 0..11 by +-12 steps, then tests scale_table[scale * 13 + interval] != 0."

[fn.scale_degree]
addr = 0x4007ee06
status = "verified"
sig = "int(int note, int key, int scale)"
evidence = "scale_table[scale * 13 + interval] - 1; scale == -1 -> note - key."

[fn.scale_quantize]
addr = 0x4007ef6a
status = "verified"
sig = "int(int note, int transpose, int key, int scale)"
evidence = "n = note + transpose; scale == -1 -> n; else the first of n+0, n-1, n+1, n-2, n+2 (offset table 0x40180850..0x40180864) for which in_scale(n', transpose + key, scale), else -1."

[fn.scale_short_name]
addr = 0x4007efc6
status = "verified"
evidence = "Returns scale_short_names[i]."

[data.scale_table]
addr = 0x40181d80
status = "verified"
evidence = "35 rows of 13 bytes: degree + 1 at each in-scale interval (0..12), 0 elsewhere. Row 0 is Ionian ... row 34 Locr. bb3 bb7 - the scale index is the name-table index - 1, Chromatic being -1."

[data.scale_short_names]
addr = 0x401edf08
status = "verified"
evidence = "36 string pointers CHRO, ION, DOR, PHRY, LYD, MIXO, AEOL, LOCR ... LO37, indexed by name index (Chromatic = 0)."

[data.scale_long_names]
addr = 0x401ede78
status = "verified"
evidence = "36 string pointers Chromatic ... Locr. bb3 bb7."

