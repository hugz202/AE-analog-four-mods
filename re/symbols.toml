# Analog Four MKII symbol map, OS 1.56.
#
# PORTED from the MK1 OS 1.56 map (branch OS-1.56) on 2026-10-21, docs/PORT-MK2.md.
# The MKII OS is the MK1's code base compiled separately: every addr below was
# matched from the MK1 1.56 image into the MKII 1.56 image (re/mk2/map_mk2.py,
# tools/xmatch.py k-gram vote plus a listing comparison) and then checked; each
# entry keeps its MK1 address as mk1 = ... and says how it was matched in mk2 = ....
# The status and evidence texts are the MK1's and still cite MK1 (often 1.55)
# addresses; the MK2 notes say what changed. Entries marked mk2_pending = true
# still hold the MK1 address and are left out of build/symbols.inc.
#
# Addresses are virtual (load base 0x40000400); file_offset = addr - 0x40000400.
#
# status = "verified"  found in this image AND its behaviour read and checked
#          "mapped"    a routine starts there and it fits, but not read in full
# evidence = how it was found / checked.

[meta]
target        = "OS1.56"
device        = "Analog Four MKII"
out_prefix    = "A4MK2"
stock_syx     = "Analog-Four_MKII_OS1.56.syx"
base          = 0x40000400
mainos_size   = 2500408
mainos_sha256 = "748fec15ddc61bc3ff66047facba74328934c5fb59f427ddaf34a4e2629a474c"

# The MKII container is ELE3 with five sections: 5 meta, 2 the bootstrap (the
# STARTUP menu and its MIDI OS UPGRADE, loaded at 0x06010000), 1 the FPGA
# bitstream, 3 MAIN OS and 8 a panel MCU image. Unlike the MK1 the bootstrap is
# NOT inside MAIN OS (the image holds no copy of it), so there is no embedded range
# to guard; build and verify instead require every section but MAIN OS to come back
# byte for byte. See docs/HAZARDS.md.
other_sections = ["section_1_FPGA.bin", "section_2_bootstrap.bin",
                  "section_5_meta.raw", "section_8_?.bin"]

# The bootstrap copies the packed MAIN OS section from flash (container offset +
# 0x80000) to `stage` and depacks it to `base` in place, over its own input; the
# OS keeps its voice calibration record from flash 0x300000. tools/verify.py checks
# both on every build.
stage       = 0x40200000
flash_at    = 0x80000
flash_limit = 0x300000

# ColdFire V4 (MCF5441x family) with EMAC and no FPU, as the Analog Rytm MKII.
cpu = "54455"
cpu_flags = []

