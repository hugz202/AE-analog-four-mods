status = "verified"
evidence = "0x4005d748 is_on: +0x10 == 1; 0x4005d758 is_off: +0x10 == 0; set by the ctor from its 'on' argument."

[const.NOTE_EV_NOTE]
value = 0x14
status = "verified"
evidence = "0x4005d73e get_note: movel +0x14; ctor stores its 4th argument there. NOT a MIDI note: the live-play handler 0x400b98b8 plays note + 30 + 12 * octave (lea %a3@(30,%d3:l) with d3 = 12 * 0x400aafb4(...), refused above 127), so the played pitch class is (note + 30) mod 12 whatever the octave."

[fn.live_note_handler]
addr = 0x400bd294
mk1 = 0x400b9ca4
mk2 = "mapped from the MK1 1.56 image: xmatch vote 44.7, listing diffs 0/17"
status = "verified"
evidence = "NoteHandler::handle of the track view: get_note, then on note-on plays 0x400b942c(this, note, note + 30 + 12 * octave, velocity) for tracks 0..5; note-off path at 0x400b9980 uses KEY NOTE."

[fn.set_step_note]
addr = 0x400afa38
mk1 = 0x400ac934
mk2 = "mapped from the MK1 1.56 image: xmatch vote 15.2, listing diffs 0/17"
status = "verified"
evidence = "(TrackPattern accessor, step, offset): clamps offset to -36..36 and writes it to storage + 686 + step * 20, then notifies. Callers are only the keyboard's hold-a-trig handlers (0x40042812, 0x40042a1a, 0x40042ade, 0x40043fca, 0x400442de); 0x4004298c passes (note - KEY NOTE + 12 * octave + 30) - 60 = final - 60 - KEY NOTE, so the offset is relative to the key: its pitch class above the root is offset mod 12."

[data.set_step_note_body]
addr = 0x400afa40
mk1 = 0x400ac93c
mk2 = "mapped from the MK1 1.56 image: xmatch vote 17.0, listing diffs 0/17"
status = "verified"
evidence = "set_step_note past `lea %sp@(-16),%sp; moveml %d2-%d4/%a2,%sp@`: moveal %sp@(20),%a2."

[fn.track_play_note]
addr = 0x400bce08
mk1 = 0x400b9818
mk2 = "mapped from the MK1 1.56 image: xmatch vote 28.1, listing diffs 1/17"
status = "verified"
sig = "void(TrackView *this, int raw, int final, int velocity)"
evidence = "THE choke point for played notes. Called by the trig-key KEYBOARD path (key events, 0x400ba1e4: final = key + 44 + 12 * octave) and by live_note_handler for NoteEvents (0x400b9976: final = note + 30 + 12 * octave). Refuses final > 127 (unsigned). Keeps 20-byte held-note entries {state, raw +4, final +8, vel +12, on +16}, and calls 0x400b7fa8(this, final, vel), which plays and live-records. Note-off 0x400b8342(this, raw) finds the entry by raw and releases its stored final, so changing final at note-on is safe."

[data.track_play_note_body]
