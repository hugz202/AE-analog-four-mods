evidence = "Control block, called from audio_isr at 0x400fd544. Per track (d2 = 0..3) it turns the track's volume (%a2@, a2 = %sp@(60) + 4 * track) into (1) the send gain written to the ring 0x80006460 by 0x400f40ee and a pan pair to 0x800062e0 by 0x400f40ba - which the FX block 0x400f849c multiplies with the send levels - and (2) the analog dry VCA words volume x pan L/R, written to 0x800032b0 + 26 * track + 22/24 (0x400f44b0, 0x400f44d6). The CV frame at 0x800032b0 is sent out by 0x40061834 (0x400fd7f2)."

[data.dry_volume_load]
addr = 0x400f48ee
