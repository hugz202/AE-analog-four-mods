evidence = "movel %a2@,%d0; macl %d0,%d5,%acc0 (2012 aa000800): the volume, loaded for the dry VCA words only - after the send gain has been written. d1 and a0 are dead here (d1 is reloaded at 0x400f4412, a0 clobbered by the call before); d2 is the track."

