[fn.project_singleton]
addr = 0x401494de
mk1 = 0x4012e890
mk2 = "checked by hand against the MK1 listing: listing identical apart from addresses; the project is 0x3df14 B here (MK1 0x3de9c)"
status = "verified"
evidence = "Lazy construction (tstl 0x415cba24, allocate 0x3de9c) and the first call of every NOTE SETUP getter/setter thunk (0x400d5f58 etc.), exactly as the Rytm's project_singleton."

[fn.current_track_pattern]
