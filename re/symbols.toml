status = "verified"
evidence = "track_index_of(this + 48) = 0x400aa78c, then the active-pattern getter 0x400a2bbe, then pattern_track 0x4009ebe4 - the Rytm routine instruction for instruction. Every NOTE SETUP thunk calls it on project_singleton's result."

