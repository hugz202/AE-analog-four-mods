# ================================================================== note input
[fn.handle_note_event]
addr = 0x40062d98
mk1 = 0x40060ef4
mk2 = "mapped from the MK1 1.56 image: xmatch vote 34.0, listing diffs 0/17"
status = "verified"
sig = "int(ViewController *this, NoteEvent *ev)"
evidence = "NOT the path trig keys take: in KEYBOARD mode they arrive as key events and reach track_play_note directly. 0001's first build hooked here and the first hardware test (2026-10-09) showed it never saw the trig keys. Builds three std::function lambdas capturing ev whose managers (0x4005feec, 0x4005ff48, 0x4005ffa4) return the typeinfos named _ZN14ViewController15handleNoteEventER9NoteEventEUl..._, and dispatches through 0x40060b52. Single caller 0x40095cba, which the main loop's message switch reaches at 0x40096abc with a NoteEvent built by 0x4005d69a."

[data.handle_note_event_body]
addr = 0x40062da0
mk1 = 0x40060efc
mk2 = "mapped from the MK1 1.56 image: xmatch vote 33.0, listing diffs 0/17"
status = "verified"
evidence = "handle_note_event past `lea %sp@(-64),%sp; moveml %d2/%a2-%a3,%sp@`: moveal %sp@(72),%a2 (ev)."

[const.NOTE_EV_ON]
