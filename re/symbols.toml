# ================================================================== audio engine
[fn.audio_isr]
addr = 0x401013be
mk1 = 0x400fb56a
mk2 = "mapped from the MK1 1.56 image: xmatch vote 24.5, listing diffs 2/17"
status = "verified"
evidence = "Installed into the vector table at 0x400002fc by 0x400fe8c8 (movel #0x400fb0d6 -> 0x400002fc). lea %sp@(-236),%sp; moveml %d0-%fp,%sp@ - saves everything - then acks 0xfc04c010, reads the playback DMA position 0xfc045690 to pick one of four buffers, saves the EMAC state, runs the control block, the voice noise (0x400f9912), the FX block (0x400f849c), and returns at 0x400fda70 (rte)."

[data.audio_isr_body]
addr = 0x401013c6
mk1 = 0x400fb572
mk2 = "checked by hand against the MK1 listing: the MKII prologue is linkw %fp,#-236; moveml %d0-%a5,%sp@ (8 bytes)"
status = "verified"
evidence = "audio_isr past its 8-byte prologue: movel #0x7fffffff,%d0. (On the MKII the prologue is linkw %fp,#-236; moveml %d0-%a5,%sp@: the frame is addressed through %fp.)"

[data.audio_isr_exit]
addr = 0x401040da
mk1 = 0x400fdee0
mk2 = "checked by hand against the MK1 listing: moveml %fp@(-32),%d0-%d6/%a0 (MK1: %sp@(204))"
status = "verified"
evidence = "The start of the EMAC-state restore: moveml %fp@(-32),%d0-%d6/%a0 (MK1: moveml %sp@(204),%d0-%d6/%a0). Every register except %fp is restored from the frame after it (moveml %fp@(-236),%d0-%a5; unlk %fp; rte), so on the MKII all are free here but %fp."

[data.audio_isr_exit_resume]
addr = 0x401040e0
mk1 = 0x400fdee6
mk2 = "checked by hand against the MK1 listing"
status = "verified"
evidence = "movel #0,%macsr after the moveml."

